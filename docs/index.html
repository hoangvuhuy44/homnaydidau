<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hôm nay đi đâu?</title><meta name="description" content="Chọn quán cà phê Hà Nội theo khu vực, khám phá danh sách và tìm món uống cho hôm nay."><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./">hôm nay đi đâu?<span>HÀ NỘI / COFFEE ROULETTE</span></a><label class="language-label"><span class="sr-only">Language / Ngôn ngữ</span><select id="language"><option value="vi">Tiếng Việt</option><option value="en">English</option></select></label><button id="themeToggle" class="secondary" aria-pressed="false">☾ Tối</button></header>
<main><section class="intro"><div><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="heading"></h1><p class="lead" data-i18n="lead"></p><a class="browse-link" href="#catalog" data-i18n="browse"></a></div><div class="controls"><p class="filter-label" id="districtLabel" data-i18n="location"></p><details id="districtDropdown"><summary id="districtSummary" aria-describedby="districtNote"></summary><div class="district-panel"><button id="clearDistricts" class="secondary" data-i18n="clear"></button><fieldset id="districtOptions" aria-labelledby="districtLabel"></fieldset></div></details><p class="small" id="districtNote" data-i18n="districtNote"></p><p id="eligibleCount" role="status" class="small"></p><label for="drinkType" data-i18n="drinkLabel"></label><select id="drinkType"><option value="all" data-i18n="allDrinks"></option><option value="coffee" data-i18n="coffee"></option><option value="other" data-i18n="other"></option></select><label class="menu-preference"><input id="preferHighlights" type="checkbox" checked><span data-i18n="preferHighlights"></span></label><button id="shuffle" class="primary" data-i18n="shuffle" disabled></button><p class="small" data-i18n="hint"></p></div></section>
<section class="roulette" data-i18n-label="roulette"><div class="reel-heading"><span>HÀ NỘI · COFFEE ROULETTE</span><span id="spinStatus" role="status"></span></div><div class="reel-window" id="reelWindow"><div class="reel-track" id="reelTrack" aria-hidden="true"></div><div class="reel-marker" aria-hidden="true"></div></div></section>
<section id="emptyState" class="empty-state" hidden><h2 data-i18n="empty"></h2><p data-i18n="emptyHelp"></p><button id="resetDistricts" class="secondary" data-i18n="clear"></button></section>
<section class="ticket" id="ticket" data-i18n-label="plan"><div class="photo"><img id="coffeePhoto" src="coffee.jpg" alt="Một tách cà phê, ảnh minh họa" width="900" height="1100"><span class="photo-label">A LITTLE COFFEE BREAK.</span></div><div class="result"><div class="ticket-top"><span data-i18n="plan"></span><span id="number"></span></div><div id="live" aria-live="polite" aria-atomic="true"><p class="eyebrow" data-i18n="visit"></p><h2 id="cafe" tabindex="-1">Đang chuẩn bị…</h2><p class="origin" id="cafeAddress"></p><div class="drink"><span class="drink-label" data-i18n="tryDrink"></span><h3 id="drinkName"></h3><p id="drinkDescription"></p><p id="drinkEvidence" class="small"></p></div></div><div class="actions"><a id="maps" class="map-button" target="_blank" rel="noopener" data-i18n="maps" hidden></a><button id="reroll" class="secondary" data-i18n="reroll" disabled></button></div><p class="disclaimer" id="drinkDisclaimer"></p><details id="menuDetails" class="menu-details"><summary id="menuSummary"></summary><p id="menuNote" class="small"></p><ul id="menuItems" class="menu-items"></ul><a id="menuCorrection" class="correction-link"></a></details></div></section>
<section id="mapSection" class="map-section" aria-labelledby="mapHeading"><div class="map-heading"><div><p class="eyebrow">HÀ NỘI / CAFÉ MAP</p><h2 id="mapHeading" data-i18n="mapHeading"></h2><p class="lead" data-i18n="mapIntro"></p></div></div><div id="mapSelection" class="map-selection" role="status" hidden><div><strong id="mapCafeName"></strong><span id="mapCafeAddress"></span></div><button id="mapReset" class="secondary" type="button" data-i18n="mapReset"></button></div><div class="map-canvas"><iframe id="collectionMap" src="https://www.google.com/maps/d/u/0/embed?mid=1HD7O0I7fkZkIFJigLAGjGEvOkkUncAE&amp;ehbc=2E312F&amp;noprof=1&amp;refresh=20260925-1024" width="640" height="480" title="Bản đồ các quán cà phê Hà Nội" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div></section>
<p id="error" role="alert" hidden><span data-i18n="loadError"></span> <button id="retry" data-i18n="retry"></button></p>
<section id="catalog" class="catalog" aria-labelledby="catalogHeading"><p class="eyebrow">HÀ NỘI / CAFÉ COLLECTION</p><h2 id="catalogHeading" data-i18n="catalog"></h2><p class="lead" data-i18n="catalogIntro"></p><label for="catalogSearch" data-i18n="search"></label><input type="search" id="catalogSearch" autocomplete="off" aria-describedby="searchHint"><p id="searchHint" class="small" data-i18n="searchHint"></p><p id="catalogCount" role="status" class="small"></p><div id="catalogGrid" class="catalog-grid"></div><p id="catalogEmpty" class="empty-state" hidden></p><button id="catalogMore" class="secondary catalog-more" type="button" aria-controls="catalogGrid" aria-expanded="false" hidden></button></section>
</main><footer><span data-i18n="footer"></span><nav class="legal-links" data-i18n-label="legal"><a href="terms.html" data-legal-link="terms" data-i18n="terms"></a><a href="privacy.html" data-legal-link="privacy" data-i18n="privacy"></a></nav></footer><script src="i18n.js"></script><script src="i18n.js"></script>
<script src="cafe-logic.js"></script>
<script src="menu-logic.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-data.js"></script>
<script src="app.js"></script>
</body>
</html>
